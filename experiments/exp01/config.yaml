# Experiment 01 -- optimisation quality against the proven optimum.
#
# Question: given a fixed evaluation budget, how close do metaheuristics get to
# the exact dynamic-programming optimum of the same objective, and how often do
# they reach it exactly?
#
# Every number in paper/tables and paper/figures is a pure function of this
# file plus the raw results CSV it produces.

name: exp01_optimisation_quality

criteria:      [otsu, kapur]
class_counts:  [2, 3, 4, 5, 6]
repairs:       [distinct, collapse]
algorithms:    [random, de, pso, ga]

runs: 25                 # >= 25 per the experimental contract
budget_per_dim: 1000     # FEs = budget_per_dim * (C - 1); C=6 gets 5000
master_seed: 20260914

use_real: true
use_phantoms: true
real_images: null        # null = every image that loads

workers: null            # null = one process per core
