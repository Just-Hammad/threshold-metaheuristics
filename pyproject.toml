[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threshmh"
version = "0.1.0"
description = "Exact and metaheuristic multilevel image thresholding, compared honestly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Pinned, not floored. A reproducibility claim that permits ">=" is not a
# reproducibility claim.
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "pandas==3.0.5",
  "matplotlib==3.11.2",
  "scikit-image==0.26.0",
  "scikit-posthocs==0.17.0",
  "pooch==1.9.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
threshmh = "threshmh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
